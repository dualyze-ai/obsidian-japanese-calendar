name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches manifest version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(jq -r .version manifest.json)"
          echo "tag=$tag manifest.json=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag '$tag' does not match manifest.json version '$version'"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify lockfile version matches the manifest version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          lock="$(node -p "require('./package-lock.json').version")"
          manifest="$(node -p "require('./manifest.json').version")"
          echo "package.json=$pkg package-lock.json=$lock manifest.json=$manifest"
          if [ "$pkg" != "$lock" ] || [ "$pkg" != "$manifest" ]; then
            echo "::error::package-lock.json is out of date; run npm install and commit the updated lockfile"
            exit 1
          fi

      - run: npm ci

      - run: npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" &>/dev/null 2>&1; then
            gh release upload "$tag" main.js manifest.json styles.css --clobber
          else
            gh release create "$tag" \
              --title "$tag" \
              --notes "Japanese holiday calendar with wareki (Japanese era), rokuyo, and daily note integration for Obsidian." \
              main.js manifest.json styles.css
          fi
